# NOTE: this workflow file cannot have the same file name across all branches, otherwise each branch will pick the 
# latest modified one. Hence the workflow files have each a different file name with the branch name as prefix. 

name: 4.x

on:
  push:
    branches: [ 4.x ]
  pull_request:
    branches: [ 4.x ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test 4.x on ${{matrix.server}}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        server: [ wildfly-mojarra4, liberty-myfaces3, glassfish-mojarra4, tomee-myfaces4, tomcat-mojarra4, tomcat-mojarra3, tomcat-myfaces4, tomcat-myfaces3, payara-mojarra4 ]
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: mvn -B verify -P ${{matrix.server}}

  deploy:
    name: Deploy 4.x SNAPSHOT
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
    - name: Extract project version
      id: project
      run: echo version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout) >> $GITHUB_OUTPUT
    - name: Deploy with Maven
      if: ${{endsWith(steps.project.outputs.version, '-SNAPSHOT')}}
      run: mvn -B deploy -Dmaven.test.skip=true
      env:
        CENTRAL_USERNAME: ${{secrets.CENTRAL_USERNAME}}
        CENTRAL_PASSWORD: ${{secrets.CENTRAL_PASSWORD}}
