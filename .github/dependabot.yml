# NOTE: this file is only read from the default branch and its updates only target the default branch.
# Maven is deliberately absent: the pom pins the Faces/Quarkus/Tomcat/Weld test matrix via test.*.version
# properties, which Dependabot would keep bumping away from the versions the CI matrix is meant to test.

# The groups cover minor and patch only, so that a major arrives as a PR of its own and can be judged and
# merged on its own. A group which also swallows majors yields one PR in which a breaking bump holds the
# routine bumps hostage, and nothing in it can be merged separately.

version: 2

updates:

  - package-ecosystem: npm
    directories:
      - /src/main/ts
      - /src/test/ts
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: [ "*" ]
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: [ "*" ]
        update-types: [ minor, patch ]
