<!DOCTYPE html>
<html lang="en"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:o="http://omnifaces.org/ui"
>
	<h:head />

	<h:body>
		<o:form id="form1">
			<h:dataTable id="table" value="#{validateUniqueColumnITBean.allVisibleItems}" var="item">
				<h:column>
					<h:inputText id="input" value="#{item.value}">
						<o:validateUniqueColumn />
					</h:inputText>
					<h:message id="message" for="input" />
				</h:column>
			</h:dataTable>
			<h:commandButton id="submit" action="#{validateUniqueColumnITBean.action}"><f:ajax execute="@form" render="@form" /></h:commandButton>
			<h:panelGroup id="ok"><h:outputText value="OK!" rendered="#{facesContext.postback and not facesContext.validationFailed}" /></h:panelGroup>
		</o:form>

		<o:form id="form2">
			<h:dataTable id="table" value="#{validateUniqueColumnITBean.paginatedItems}" var="item" rows="2">
				<h:column>
					<h:inputText id="input" value="#{item.value}">
						<o:validateUniqueColumn />
					</h:inputText>
					<h:message id="message" for="input" />
				</h:column>
			</h:dataTable>
			<h:commandButton id="submit" action="#{validateUniqueColumnITBean.action}"><f:ajax execute="@form" render="@form" /></h:commandButton>
			<h:panelGroup id="ok"><h:outputText value="OK!" rendered="#{facesContext.postback and not facesContext.validationFailed}" /></h:panelGroup>
		</o:form>

		<o:form id="form3">
			<h:dataTable id="table" value="#{validateUniqueColumnITBean.partiallyExecutedItems}" var="item">
				<h:column>
					<h:inputText id="input" value="#{item.value}">
						<o:validateUniqueColumn />
					</h:inputText>
					<h:message id="message" for="input" />
					<h:commandButton id="submit" value="submit" action="#{validateUniqueColumnITBean.action}"><f:ajax execute="input" render="@form" /></h:commandButton>
				</h:column>
			</h:dataTable>
			<h:panelGroup id="ok"><h:outputText value="OK!" rendered="#{facesContext.postback and not facesContext.validationFailed}" /></h:panelGroup>
		</o:form>

		<o:form id="form4">
			<h:inputText id="other" value="#{validateUniqueColumnITBean.otherInput}" required="true" />
			<h:message id="otherMessage" for="other" />
			<h:dataTable id="table" value="#{validateUniqueColumnITBean.itemsBesideOtherInput}" var="item">
				<h:column>
					<h:inputText id="input" value="#{item.value}">
						<o:validateUniqueColumn />
					</h:inputText>
					<h:message id="message" for="input" />
				</h:column>
			</h:dataTable>
			<h:commandButton id="submit" action="#{validateUniqueColumnITBean.action}"><f:ajax execute="@form" render="@form" /></h:commandButton>
			<h:panelGroup id="ok"><h:outputText value="OK!" rendered="#{facesContext.postback and not facesContext.validationFailed}" /></h:panelGroup>
		</o:form>

		<o:form id="form5">
			<h:dataTable id="table" value="#{validateUniqueColumnITBean.nonAjaxItems}" var="item">
				<h:column>
					<h:inputText id="input" value="#{item.value}">
						<o:validateUniqueColumn />
					</h:inputText>
					<h:message id="message" for="input" />
				</h:column>
			</h:dataTable>
			<h:commandButton id="submit" value="submit" action="#{validateUniqueColumnITBean.action}" />
			<h:panelGroup id="ok"><h:outputText value="OK!" rendered="#{facesContext.postback and not facesContext.validationFailed}" /></h:panelGroup>
		</o:form>

</h:body>
</html>
