<!DOCTYPE html>
<html lang="en"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:t="tags"
    xmlns:test="jakarta.faces.composite/test"
>
    <h:head />

    <h:body>
        <div id="nestedTagFile"><t:declared attr="A"><t:declared/></t:declared></div>
        <div id="nestedTagFileWithDefault"><t:declared attr="A"><t:declaredWithDefault/></t:declared></div>
        <div id="nestedTagFileWithOwnAttribute"><t:declared attr="A"><t:declared attr="B"/></t:declared></div>
        <div id="nestedTagFileWithSameAttribute"><t:declared attr="A"><t:declared attr="A"/></t:declared></div>
        <div id="nestedTagFileWithSameExpression"><t:declared attr="#{'A'}"><t:declared attr="#{'A'}"/></t:declared></div>
        <div id="nestedTagFileThreeLevels"><t:declared attr="A"><t:declared><t:declared/></t:declared></t:declared></div>
        <div id="nestedTagFileThroughInclude"><t:declared attr="A"><ui:include src="/include.xhtml"/></t:declared></div>
        <div id="nestedTagFileThroughTemplate"><t:declared attr="A"><ui:decorate template="/template.xhtml"><ui:define name="body"><t:declared/></ui:define></ui:decorate></t:declared></div>
        <div id="nestedTagFileThroughComposite"><t:declared attr="A"><test:nested/></t:declared></div>
        <div id="parentTagFile"><t:wrapper attr="A"><t:declared/></t:wrapper></div>
        <div id="parentTagFileWithDefault"><t:wrapper attr="A"><t:declaredWithDefault/></t:wrapper></div>
        <div id="siblingTagFile"><t:declared attr="A"/><t:declared/></div>
        <div id="undeclaredParentTagFile"><t:plain attr="A"><t:declared/></t:plain></div>
        <div id="undeclaredParentTagFileBaseline"><t:plain attr="A"><t:plain/></t:plain></div>
        <div id="uiParam"><ui:decorate template="/template.xhtml"><ui:param name="attr" value="Q"/><ui:define name="body"><t:declared/></ui:define></ui:decorate></div>
        <div id="uiParamBaseline"><ui:decorate template="/template.xhtml"><ui:param name="attr" value="Q"/><ui:define name="body"><t:plain/></ui:define></ui:decorate></div>
        <div id="siblingIds"><t:identified/><t:identified/></div>
        <div id="nestedIds"><t:identified><t:identified/><t:identified/></t:identified></div>
        <div id="explicitId"><t:identified id="X"><t:identified/></t:identified></div>
        <div id="childOfGeneratedId"><t:identifier><t:child field="F"/></t:identifier></div>
        <div id="childOfDeclaredAttribute"><t:declared attr="A"><t:child field="F"/></t:declared></div>
        <div id="siblingChildren"><t:identifier><t:child field="F"/><t:child field="G"/></t:identifier></div>
        <div id="localVariableOfParentTagFile"><t:setter><t:declaredLocal/></t:setter></div>
        <div id="localVariableOfParentTagFileBaseline"><t:setter><t:plainLocal/></t:setter></div>
        <div id="declaredNameSetByParentTagFile"><t:declaringSetter><t:declaredLocal/></t:declaringSetter></div>
    </h:body>
</html>
