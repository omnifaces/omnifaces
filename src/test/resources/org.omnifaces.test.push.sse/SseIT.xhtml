<!DOCTYPE html>
<html lang="en"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:o="omnifaces"
>
    <h:head>
        <script>
            function clearMessages(data) {
                if (data.status == "begin") {
                    document.getElementById("applicationScopedEventMessage").innerHTML = "";
                    document.getElementById("sessionScopedUserTargetedMessage").innerHTML = "";
                    document.getElementById("viewScopedAjaxAwareMessage").innerHTML = "";
                }
            }

            function clientOpened(channel) {
                document.getElementById("clientOpenedMessages").innerHTML += "|" + channel + "|";
            }

            function showMessage(message, channel) {
                document.getElementById(channel + "Message").innerHTML = message;
            }

            function closeAllSse() {
                OmniFaces.Push.close("viewScopedAjaxAware");
                OmniFaces.Push.close("sessionScopedUserTargeted");
            }

            function clientClosed(channel) {
                document.getElementById("clientClosedMessages").innerHTML += "|" + channel + "|";
            }
        </script>
    </h:head>

    <h:body>
        <h:messages id="messages" />
        <h:link id="newtab" value="newtab" target="_blank" />

        <div id="clientOpenedMessages" />
        <div id="applicationScopedEventMessage" />
        <div id="sessionScopedUserTargetedMessage" />
        <h:outputText id="viewScopedAjaxAwareMessage" value="#{sseITBean.ajaxAwareMessage}" />
        <div id="clientClosedMessages" />

        <o:form id="push">
            <f:ajax onevent="clearMessages" render=":messages">
                <h:commandButton id="applicationScopedEvent" value="applicationScopedEvent" action="#{sseITBean.pushApplicationScopedEvent}" />
                <h:commandButton id="sessionScopedUserTargeted" value="sessionScopedUserTargeted" action="#{sseITBean.pushSessionScopedUserTargeted('42')}" />
                <h:commandButton id="viewScopedAjaxAware" value="viewScopedAjaxAware" action="#{sseITBean.pushViewScopedAjaxAware}" />
            </f:ajax>
        </o:form>

        <h:link id="closeAllSse" value="closeAllSse" onclick="closeAllSse();return false;" />

        <o:sse channel="applicationScopedEvent" onopen="clientOpened" onmessage="showMessage" onclose="clientClosed" />
        <o:sse channel="sessionScopedUserTargeted" user="42" onopen="clientOpened" onmessage="showMessage" onclose="clientClosed" />

        <o:form>
            <o:sse channel="viewScopedAjaxAware" scope="view" onopen="clientOpened" onclose="clientClosed">
                <f:ajax event="someAjaxEventName" render=":viewScopedAjaxAwareMessage" />
            </o:sse>
        </o:form>
    </h:body>
</html>
