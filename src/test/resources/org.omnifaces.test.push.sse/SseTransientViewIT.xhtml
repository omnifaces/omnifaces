<!DOCTYPE html>
<html lang="en"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:o="omnifaces"
>
    <f:view transient="true">
        <h:head>
            <script>
                function clearMessage(data) {
                    if (data.status == "begin") {
                        document.getElementById("applicationScopedMessage").innerHTML = "";
                    }
                }

                function clientOpened(channel) {
                    document.getElementById("clientOpenedMessages").innerHTML += "|" + channel + "|";
                }

                function showMessage(message) {
                    document.getElementById("applicationScopedMessage").innerHTML = message;
                }
            </script>
        </h:head>

        <h:body>
            <h:outputText id="transient" value="#{facesContext.viewRoot.isTransient()}" />
            <h:messages id="messages" />

            <div id="clientOpenedMessages" />
            <div id="applicationScopedMessage" />

            <h:form id="push">
                <h:commandButton id="applicationScoped" value="applicationScoped" action="#{sseTransientViewITBean.push}">
                    <f:ajax onevent="clearMessage" render=":messages" />
                </h:commandButton>
            </h:form>

            <o:sse channel="transientViewApplicationScoped" onopen="clientOpened" onmessage="showMessage" />
        </h:body>
    </f:view>
</html>
